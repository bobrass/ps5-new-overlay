name: Build and Release PS5 Overlay

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: true
        type: boolean
        default: true
      release_version:
        description: 'Release Tag/Version (e.g. v1.0.19)'
        required: false
        default: 'v1.0.19'

permissions:
  contents: write

jobs:
  build:
    name: Build PS5 Overlay ELF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget unzip make \
            clang-18 lld-18 llvm-18 llvm-18-dev \
            python3

          # Ensure LLVM toolchain binaries and symlinks are set
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Download and install PS5 Payload SDK
        run: |
          echo "Downloading latest PS5 Payload SDK v0.43..."
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo rm -rf /opt/ps5-payload-sdk
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          sudo chmod -R 755 /opt/ps5-payload-sdk
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
          echo "LLVM_CONFIG=/usr/bin/llvm-config-18" >> $GITHUB_ENV
          echo "/opt/ps5-payload-sdk/bin" >> $GITHUB_PATH
          test -x /opt/ps5-payload-sdk/bin/prospero-clang

      - name: Build ps5-overlay ELF
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export LLVM_CONFIG=/usr/bin/llvm-config-18
          export PATH="/opt/ps5-payload-sdk/bin:/usr/lib/llvm-18/bin:${PATH}"

          TAG_OR_VER="v1.0.19"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_OR_VER="${GITHUB_REF#refs/tags/}"
          fi

          make clean
          make VERSION="${TAG_OR_VER}"

          mkdir -p dist
          cp bin/*.elf dist/

          cd dist
          sha256sum *.elf > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps5-overlay-build
          path: |
            dist/*.elf
            dist/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ps5-overlay-build
          path: dist

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ inputs.release_version }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: PS5 In-Game Overlay ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 PS5 In-Game Overlay ${{ steps.vars.outputs.tag }}

            Standalone in-game hardware telemetry overlay for jailbroken PlayStation 5 with real-time hardware monitoring and built-in Web configuration panel.

            ### ✨ Features
            - **12 Live Hardware Metrics**:
              - **FPS**: Hardware Display Controller Engine scanout flip counter (`/dev/dce`)
              - **CPU**: Zen 2 Tctl core temperature (°C)
              - **LOAD**: CPU utilization (%)
              - **CCLK**: Zen 2 CPU core frequencies in MHz
              - **GPU**: AMD RDNA 2 SoC GPU temperature (°C)
              - **GCLK**: RDNA 2 GFXCLK clock in MHz
              - **RAM**: System memory usage (GB)
              - **VRAM**: Video memory usage (GB)
              - **SSD**: M.2 NVMe SSD expansion drive temperature (°C via SoC channel 2)
              - **FAN**: Blower fan duty cycle (%)
              - **PWR**: SoC APU power consumption in Watts
              - **IP**: PlayStation 5 local IPv4 address
            - **Web Configuration Panel (Port 8585)**:
              - Full remote control via browser at `http://<PS5_IP>:8585`
              - Live preview, reorder metrics, custom colors (HEX/Picker), position & offset adjustments
              - Graceful overlay unloader to quit without restarting console
            - **Persistent Config**: Automatically saved to `/data/overlay/config.ini`

            ### 🚀 Quick Start
            Send the ELF binary to your jailbroken PS5 via port 9020 or 9021:
            ```bash
            nc -q0 <PS5_IP> 9021 < ps5-overlay-kus_${{ steps.vars.outputs.tag }}.elf
            ```
          files: |
            dist/*.elf
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
